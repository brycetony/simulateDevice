name: gate
# 质量门禁：检查不过，PR 不能合并。
# 关键点：门禁由系统强制执行（branch protection），不依赖 agent "记得遵守"。
# 原则：凡是机器能判定的，不留给人的自觉——AGENTS.md 是宣言，这里是落地。
# 注意：本仓库默认分支是 master；新增契约域时同步更新下方 PREFIXES（与 AGENTS.md §6 注册表一致）。

on:
  pull_request:

jobs:
  contract-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # diff 类检查需要完整历史
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm" }
      - run: npm ci

      # 第一批契约测试落库前此步为红（无测试文件）——这是特性不是缺陷：
      # 没有契约测试就不该有合并。启用 required 前先完成裁决回填（见 docs/tasks/RESEARCH-tools-2026-11-04.md）。
      - name: 契约测试 + 历史故障回归（一票否决）
        run: npx vitest run tests/contracts tests/faults

      - name: PR 必须挂任务卡（T-xxx），且卡片真实存在
        env: { PR_BODY: "${{ github.event.pull_request.body }}" }
        run: |
          ids=$(echo "$PR_BODY" | grep -oE 'T-[0-9]+' | sort -u)
          [ -n "$ids" ] || { echo "PR 描述缺少任务卡编号 T-xxx"; exit 1; }
          for id in $ids; do
            ls docs/tasks/${id}-*.md >/dev/null 2>&1 || {
              echo "任务卡 $id 在 docs/tasks/ 中不存在"; exit 1; }
          done

      # 防同源错误只防得住「忘记标注」，防不住「虚假标注」——
      # 所以这里同时校验：标注的契约/故障 ID 必须真实存在于 docs/。
      # PREFIXES = 契约域前缀白名单（AGENTS.md §6）；白名单外的 ID（如 SHA-256）不误伤。
      - name: 溯源检查：测试声明的契约/故障 ID 必须真实存在
        run: |
          PREFIXES='(TOOLS|DEV|CMD|AUTH|F)'
          bad=0
          changed=$(git diff --name-only origin/master...HEAD -- 'tests/contracts/*.test.ts' 'tests/faults/*.test.ts')
          for f in $changed; do
            [ -f "$f" ] || continue
            head -5 "$f" | grep -q 'docs/contracts\|docs/faults' || {
              echo "$f 未声明断言来源（契约/故障 ID）"; bad=1; continue; }
            ids=$(grep -hoE "\b${PREFIXES}-[0-9]+(-[0-9]+)*" "$f" | sort -u)
            [ -n "$ids" ] || { echo "$f 声明了路径但没有任何条目 ID"; bad=1; continue; }
            for id in $ids; do
              grep -rqE "${id}([^0-9]|$)" docs/contracts docs/faults || {
                echo "$f 引用的 $id 在 docs/ 中不存在（伪造或已过期的 ID）"; bad=1; }
            done
          done
          [ "$bad" -eq 0 ] || exit 1

      # 反向链接：契约说"这个判据由某测试覆盖"，那这个测试必须真的存在。
      - name: 反向链接：契约/故障文档引用的测试文件必须存在
        run: |
          missing=0
          for doc in docs/contracts/*.md docs/faults/*.md; do
            [ -f "$doc" ] || continue
            for t in $(grep -hoE 'tests/[A-Za-z0-9/._-]+\.(ts|js|mjs)' "$doc"); do
              [ -f "$t" ] || { echo "$doc 引用的 $t 不存在（判据与测试脱节）"; missing=1; }
            done
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: diff 尺寸检查（>800 行硬卡，对应 AGENTS.md §3；锁文件等生成物不计入）
        run: |
          total=$(git diff origin/master...HEAD --numstat -- . ':(exclude)package-lock.json' ':(exclude)*.lock' ':(exclude)*.tsbuildinfo' | awk '{a+=$1; d+=$2} END {print a+d+0}')
          echo "变更规模（不含锁文件）: $total 行"
          if [ "$total" -gt 800 ]; then
            echo "diff $total 行 > 800：请拆分任务后再提交（AGENTS.md §3）"; exit 1
          fi
